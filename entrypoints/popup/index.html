<!doctype html>
<html data-theme="i-hate-mailto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="manifest.type" content="browser_action" />
    <link rel="icon" type="image/svg+xml" href="/assets/i-hate-mailto.svg" />
    <title data-i18n="popupTitle"></title>
  </head>
  <body class="w-80">
    <main class="p-4 space-y-4">
      <header class="space-y-1">
        <h1 class="text-lg font-bold" data-i18n="popupHeaderHeading"></h1>
        <p class="text-xs opacity-70" data-i18n="popupHeaderDescription"></p>
      </header>
      <h2 class="card-title" data-i18n="generalSettingsHeading"></h2>
      <dl class="space-y-2 text-sm">
        <div class="flex justify-between">
          <dt class="opacity-70" data-i18n="copyModeLabel"></dt>
          <dd id="copy-mode" class="font-medium capitalize badge badge-secondary"></dd>
        </div>
      </dl>

      <h2 class="card-title" data-i18n="toastSettingsHeading"></h2>
      <dl class="space-y-2 text-sm">
        <div class="flex justify-between">
          <dt class="opacity-70" data-i18n="toastDurationRangeLabel"></dt>
          <dd id="duration" class="font-medium"></dd>
        </div>
        <div class="flex justify-between">
          <dt class="opacity-70" data-i18n="toastPositionLabel"></dt>
          <dd id="position" class="font-medium capitalize"></dd>
        </div>
        <div class="flex justify-between items-center">
          <dt class="opacity-70" data-i18n="popupToastColorsLabel"></dt>
          <dd id="badges" class="flex gap-1"></dd>
        </div>
      </dl>

      <button
        id="open-options-button"
        type="button"
        class="btn btn-block btn-secondary"
        data-i18n="popupOpenOptionsButton"
      ></button>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
