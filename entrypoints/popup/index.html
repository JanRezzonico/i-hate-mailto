<!doctype html>
<html lang="en" data-theme="i-hate-mailto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="manifest.type" content="browser_action" />
    <title>I Hate Mailto by rezzonico.dev</title>
  </head>
  <body class="w-80">
    <main class="p-4 space-y-4">
      <header class="space-y-1">
        <h1 class="text-lg font-bold">I Hate Mailto by rezzonico.dev</h1>
        <p class="text-sm opacity-70">
          Clicking a <code>mailto:</code> link copies the address to your clipboard instead of opening a mail app.
        </p>
      </header>

      <h2 class="card-title">Toast Settings</h2>
      <dl class="space-y-2 text-sm">
        <div class="flex justify-between">
          <dt class="opacity-70">Duration</dt>
          <dd id="duration" class="font-medium"></dd>
        </div>
        <div class="flex justify-between">
          <dt class="opacity-70">Position</dt>
          <dd id="position" class="font-medium capitalize"></dd>
        </div>
        <div class="flex justify-between items-center">
          <dt class="opacity-70">Colors</dt>
          <dd id="swatches" class="flex gap-1"></dd>
        </div>
      </dl>

      <button id="open-options" type="button" class="btn btn-primary btn-block">Open settings</button>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
