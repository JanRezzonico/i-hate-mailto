<!doctype html>
<html lang="en" data-theme="i-hate-mailto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="manifest.open_in_tab" content="true" />
    <title id="title"></title>
  </head>
  <body class="min-h-screen bg-base-200">
    <main class="mx-auto max-w-2xl p-6 space-y-6">
      <header>
        <h1 class="text-2xl font-bold" id="header-heading"></h1>
        <p class="opacity-70" id="header-description"></p>
      </header>

      <form id="form" novalidate class="space-y-6">
        <section class="card bg-base-100 shadow-sm">
          <div class="card-body gap-4">
            <h2 class="card-title" id="general-settings-heading"></h2>

            <label class="form-control w-full">
              <span class="label-text mb-1 font-medium" id="copy-mode-label"></span>
              <select id="copy-mode" class="select select-bordered w-full capitalize"></select>
            </label>
            <div class="w-full border-l-2 bg-base-200 border-secondary p-2 rounded-sm flex flex-col gap-2">
              <div>
                <span id="copy-mode-to-label" class="font-bold"></span>
                <p class="text-sm opacity-70" id="copy-mode-to-description"></p>
              </div>
              <div>
                <span id="copy-mode-recipients-label" class="font-bold"></span>
                <p class="text-sm opacity-70" id="copy-mode-recipients-description"></p>
              </div>
              <div>
                <span id="copy-mode-full-label" class="font-bold"></span>
                <p class="text-sm opacity-70" id="copy-mode-full-description"></p>
              </div>
              <div>
                <a
                  href="https://www.rfc-editor.org/info/rfc6068/"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="link link-secondary link-hover text-sm"
                >
                  RFC 6068 - The "mailto" URI Scheme
                </a>
              </div>
            </div>
          </div>
        </section>
        <section class="card bg-base-100 shadow-sm">
          <div class="card-body gap-4">
            <h2 class="card-title" id="toast-settings-heading"></h2>

            <label class="form-control w-full">
              <span class="label-text mb-1 font-medium" id="duration-label"></span>
              <input id="duration" type="number" step="250" class="input input-bordered w-full" />
              <span id="duration-error" class="mt-1 hidden text-sm text-error"></span>
            </label>

            <label class="form-control w-full">
              <span class="label-text mb-1 font-medium" id="position-label"></span>
              <select id="position" class="select select-bordered w-full capitalize"></select>
            </label>
            <div class="divider my-0"></div>
            <div id="colors" class="space-y-3"></div>
          </div>
        </section>

        <div class="flex justify-between">
          <button id="reset" type="button" class="btn btn-outline btn-secondary"></button>
          <button id="save" type="submit" class="btn btn-secondary" disabled></button>
        </div>

        <div id="status" role="alert" class="alert hidden"></div>
      </form>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
