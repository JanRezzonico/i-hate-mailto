<!doctype html>
<html lang="en" data-theme="i-hate-mailto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="manifest.open_in_tab" content="true" />
    <title id="title"></title>
  </head>
  <body class="min-h-screen bg-base-200">
    <main class="mx-auto max-w-2xl p-6 space-y-6">
      <header>
        <h1 class="text-2xl font-bold">Settings</h1>
        <p class="opacity-70">Customize the toast shown when an email address is copied.</p>
      </header>

      <form id="form" novalidate class="space-y-6">
        <section class="card bg-base-100 shadow-sm">
          <div class="card-body gap-4">
            <h2 class="card-title">Toast Settings</h2>

            <label class="form-control w-full">
              <span class="label-text mb-1 font-medium">Duration (ms)</span>
              <input id="duration" type="number" step="250" class="input input-bordered w-full" />
              <span id="duration-error" class="mt-1 hidden text-sm text-error"></span>
            </label>

            <label class="form-control w-full">
              <span class="label-text mb-1 font-medium">Position</span>
              <select id="position" class="select select-bordered w-full capitalize"></select>
            </label>
            <div class="divider my-0"></div>
            <div id="colors" class="space-y-3"></div>
          </div>
        </section>

        <div id="status" role="alert" class="alert hidden"></div>

        <div class="flex justify-between">
          <button id="reset" type="button" class="btn btn-ghost">Reset to defaults</button>
          <button id="save" type="submit" class="btn btn-primary" disabled>Save</button>
        </div>
      </form>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
