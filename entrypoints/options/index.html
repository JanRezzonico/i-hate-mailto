<!doctype html>
<html data-theme="i-hate-mailto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="manifest.open_in_tab" content="true" />
    <link rel="icon" type="image/svg+xml" href="/assets/i-hate-mailto.svg" />
    <title data-i18n="optionsTitle"></title>
  </head>
  <body class="min-h-screen bg-base-200">
    <main class="mx-auto max-w-2xl p-6 space-y-6">
      <header>
        <h1 class="text-2xl font-bold" data-i18n="optionsHeaderHeading"></h1>
        <p class="opacity-70" data-i18n="optionsHeaderDescription"></p>
      </header>

      <form id="form" novalidate class="space-y-6">
        <div class="flex justify-between">
          <button
            id="top-reset"
            type="button"
            class="btn btn-outline btn-secondary"
            data-i18n="optionsResetButton"
          ></button>
          <button id="top-save" type="submit" class="btn btn-secondary" data-i18n="optionsSaveButton" disabled></button>
        </div>

        <section class="card bg-base-100 shadow-sm">
          <div class="card-body gap-4">
            <h2 class="card-title" data-i18n="generalSettingsHeading"></h2>

            <fieldset class="space-y-3 flex justify-between">
              <legend class="label-text font-medium" data-i18n="linkTypesLabel"></legend>
              <label class="label justify-start gap-3">
                <input id="mailto-enabled" type="checkbox" class="toggle toggle-secondary toggle-lg" />
                <span data-i18n="mailtoLinksLabel"></span>
              </label>
              <label class="label justify-start gap-3">
                <input id="tel-enabled" type="checkbox" class="toggle toggle-secondary toggle-lg" />
                <span data-i18n="telLinksLabel"></span>
              </label>
              <label class="label justify-start gap-3">
                <input id="sms-enabled" type="checkbox" class="toggle toggle-secondary toggle-lg" />
                <span data-i18n="smsLinksLabel"></span>
              </label>
            </fieldset>

            <label class="form-control w-full">
              <span class="label-text mb-1 font-medium" data-i18n="copyModeLabel"></span>
              <select id="copy-mode" class="select select-secondary w-full capitalize"></select>
            </label>
            <div class="w-full rounded-md border border-secondary/30 bg-base-200 p-3 flex flex-col gap-2">
              <div id="copy-mode-descriptions" class="flex flex-col gap-2"></div>
              <details>
                <summary class="cursor-pointer text-sm font-medium" data-i18n="protocolReferencesSummary"></summary>
                <div class="mt-2 flex flex-col gap-2">
                  <a
                    href="https://www.rfc-editor.org/info/rfc6068/"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="link link-secondary link-hover text-sm"
                  >
                    RFC 6068 - The "mailto" URI Scheme
                  </a>
                  <a
                    href="https://www.rfc-editor.org/info/rfc3966/"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="link link-secondary link-hover text-sm"
                  >
                    RFC 3966 - The tel URI for Telephone Numbers
                  </a>
                  <a
                    href="https://www.rfc-editor.org/info/rfc5724/"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="link link-secondary link-hover text-sm"
                  >
                    RFC 5724 - URI Scheme for Global System for Mobile Communications (GSM) Short Message Service (SMS)
                  </a>
                </div>
              </details>
            </div>
          </div>
        </section>
        <section class="card bg-base-100 shadow-sm">
          <div class="card-body gap-4">
            <h2 class="card-title" data-i18n="toastSettingsHeading"></h2>

            <div class="grid gap-4 sm:grid-cols-2">
              <label class="form-control w-full">
                <span class="label-text mb-1 font-medium" data-i18n="toastDurationMinLabel"></span>
                <input id="duration-min" type="number" step="250" class="input input-secondary w-full" />
              </label>
              <label class="form-control w-full">
                <span class="label-text mb-1 font-medium" data-i18n="toastDurationMaxLabel"></span>
                <input id="duration-max" type="number" step="250" class="input input-secondary w-full" />
              </label>
            </div>
            <span id="duration-error" class="mt-1 hidden text-sm text-error"></span>

            <label class="form-control w-full">
              <span class="label-text mb-1 font-medium" data-i18n="toastPositionLabel"></span>
              <select id="position" class="select select-secondary w-full capitalize"></select>
            </label>
            <div class="divider my-0"></div>
            <div id="colors" class="space-y-3"></div>
          </div>
        </section>

        <section class="card bg-base-100 shadow-sm">
          <div class="card-body gap-4">
            <h2 class="card-title" data-i18n="disabledSitesHeading"></h2>
            <p class="text-sm opacity-70" data-i18n="disabledSitesDescription"></p>
            <ul id="disabled-sites" class="list-disc pl-5 text-sm"></ul>
            <p id="disabled-sites-empty" class="text-sm opacity-70" data-i18n="disabledSitesEmpty"></p>
            <button
              id="remove-disabled-sites"
              type="button"
              class="btn btn-outline btn-error self-start"
              data-i18n="disabledSitesRemoveAllButton"
            ></button>
          </div>
        </section>

        <div class="flex justify-between">
          <button
            id="bottom-reset"
            type="button"
            class="btn btn-outline btn-secondary"
            data-i18n="optionsResetButton"
          ></button>
          <button
            id="bottom-save"
            type="submit"
            class="btn btn-secondary"
            data-i18n="optionsSaveButton"
            disabled
          ></button>
        </div>
      </form>
    </main>

    <template id="copy-mode-description-template">
      <div>
        <span class="font-bold" data-role="label"></span>
        <p class="text-sm opacity-70" data-role="description"></p>
      </div>
    </template>

    <template id="color-row-template">
      <div class="grid grid-cols-[4rem_1fr_1fr_1fr] items-center gap-3">
        <span class="font-medium capitalize" data-role="type"></span>
        <label class="flex items-center gap-2 text-sm">
          <input type="color" data-field="background" class="h-8 w-10 cursor-pointer" />
          <span data-i18n="background"></span>
        </label>
        <label class="flex items-center gap-2 text-sm">
          <input type="color" data-field="text" class="h-8 w-10 cursor-pointer" />
          <span data-i18n="text"></span>
        </label>
        <div data-role="preview" class="rounded-md px-3 py-1.5 text-center text-sm capitalize cursor-default"></div>
      </div>
    </template>

    <dialog id="reset-confirmation" class="modal" aria-labelledby="reset-confirmation-title">
      <div class="modal-box">
        <h3 id="reset-confirmation-title" class="text-lg font-bold" data-i18n="optionsResetConfirmationTitle"></h3>
        <p class="py-4" data-i18n="optionsResetConfirmationDescription"></p>
        <div class="modal-action">
          <button id="reset-cancel" type="button" class="btn" data-i18n="optionsCancelButton"></button>
          <button
            id="reset-confirm"
            type="button"
            class="btn btn-secondary"
            data-i18n="optionsResetConfirmationButton"
          ></button>
        </div>
      </div>
      <form method="dialog" class="modal-backdrop">
        <button type="submit" aria-label="Close"></button>
      </form>
    </dialog>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
